<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Clock with Voice Command</title>
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />

    <style>
      button:hover {
        background-color: orange;
        border-color: white;
      }

      button {
        margin: 50px;
        padding: 10px;
        border-color: orange;
        border-radius: 30%;
      }

      h1 {
        color: orange;
      }

      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: seagreen;
      }

      #clock {
        margin-top: 50px;
        font-size: 6em;
      }
    </style>
  </head>

  <body>
    <h1>Hand Wash APP ⏱⏲</h1>

    <div id="clock"></div>

    <button id="btn" onclick="toggleAlarm()">Enable Alarm</button>

    <label for="volume">Volume: </label>
    <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />

    <script>
      let alarmEnabled = false;
      let lastSpokenTime = "";

      const sounds = {
        handWash: "./sounds/regular_reminder.mp3",
        handingOver: "./sounds/handing_over.mp3",
        focus: "./sounds/don't_loose_focus.mp3",
        goodbye: "./sounds/goodbye.mp3",
        goodMorning: "./sounds/goodmorning.mp3",
        peak: "./sounds/peakperiod.mp3",
      };

      function updateClock() {
        const now = new Date();

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");

        const currentTime = `${hours}:${minutes}:${seconds}`;

        document.getElementById("clock").textContent = currentTime;

        // Only check reminders when alarm is enabled
        if (!alarmEnabled) {
          return;
        }

        // Prevent duplicate announcements
        if (lastSpokenTime === currentTime) {
          return;
        }

        // Every scheduled announcement happens at seconds 00
        if (seconds !== "00") {
          return;
        }

        // Regular hand wash reminder - TESTING AT :30
        if (minutes === "30") {
          playAnnouncement(sounds.handWash);
          lastSpokenTime = currentTime;
        }

        // 03:00 - Handing over
        else if (hours === "03" && minutes === "00") {
          playAnnouncement(sounds.handingOver);
          lastSpokenTime = currentTime;
        }

        // Even hours at :00 - Focus
        else if (minutes === "00" && Number(hours) % 2 === 0) {
          playAnnouncement(sounds.focus);
          lastSpokenTime = currentTime;
        }

        // 09:00 - Good morning
        else if (hours === "09" && minutes === "00") {
          playAnnouncement(sounds.goodMorning);
          lastSpokenTime = currentTime;
        }

        // 11:00 - Peak period
        else if (hours === "11" && minutes === "00") {
          playAnnouncement(sounds.peak);
          lastSpokenTime = currentTime;
        }

        // 00:00 - Goodbye
        else if (hours === "00" && minutes === "00") {
          playAnnouncement(sounds.goodbye);
          lastSpokenTime = currentTime;

          setTimeout(() => {
            disableAlarm();
          }, 3000);
        }
      }

      function playAnnouncement(voiceFile) {
        const volume = parseFloat(document.getElementById("volume").value);

        // First play the announcement/chime
        const alertSound = new Audio("./sounds/annoucement.mp3");

        alertSound.volume = volume;

        alertSound.addEventListener("ended", () => {
          // After chime finishes, play ElevenLabs recording
          const voice = new Audio(voiceFile);

          voice.volume = volume;

          voice.play().catch((err) => {
            console.error("Could not play voice:", err);
          });
        });

        alertSound.play().catch((err) => {
          console.error("Could not play announcement sound:", err);
        });
      }

      function enableAlarm() {
        alarmEnabled = true;
        alert("Alarm enabled!");
      }

      function disableAlarm() {
        alarmEnabled = false;
        alert("Alarm disabled!");
      }

      function toggleAlarm() {
        const btn = document.getElementById("btn");

        if (alarmEnabled === false) {
          enableAlarm();
          btn.textContent = "Disable Alarm";
        } else {
          disableAlarm();
          btn.textContent = "Enable Alarm";
        }
      }

      // Start clock
      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
