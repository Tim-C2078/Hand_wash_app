<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Clock with Voice Command</title>
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />

    <style>
      button:hover {
        background-color: orange;
        border-color: white;
      }

      button {
        margin: 50px;
        padding: 10px;
        border-color: orange;
        border-radius: 30%;
      }

      h1 {
        color: orange;
      }

      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: seagreen;
      }

      #clock {
        margin-top: 50px;
        font-size: 6em;
      }
    </style>
  </head>

  <body>
    <h1>Hand Wash APP ⏱⏲</h1>

    <div id="clock"></div>

    <button id="btn" onclick="toggleAlarm()">Enable Alarm</button>

    <label for="volume">Volume: </label>
    <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />

    <script>
      let alarmEnabled = false;
      let lastSpokenTime = "";

      const sounds = {
        handWash: "./sounds/regular_reminder.mp3",
        handingOver: "./sounds/handing_over.mp3",
        focus: "./sounds/don't_loose_focus.mp3",
        goodbye: "./sounds/goodbye.mp3",
        goodMorning: "./sounds/goodmorning.mp3",
        peak: "./sounds/peakperiod.mp3",
      };

      function updateClock() {
        const now = new Date();

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");

        const currentTime = `${hours}:${minutes}:${seconds}`;

        document.getElementById("clock").textContent = currentTime;

        // Alarm is disabled
        if (!alarmEnabled) {
          return;
        }

        // Only trigger announcements at exactly :00 seconds
        if (seconds !== "00") {
          return;
        }

        // Prevent duplicate announcements
        if (lastSpokenTime === currentTime) {
          return;
        }

        let announcement = null;

        // ==========================================
        // 1. SPECIFIC MESSAGES - HIGHEST PRIORITY
        // ==========================================

        // 00:00 - Goodbye
        if (hours === "00" && minutes === "00") {
          announcement = sounds.goodbye;
        }

        // 03:00 - Handing over
        else if (hours === "03" && minutes === "00") {
          announcement = sounds.handingOver;
        }

        // 09:00 - Good morning
        else if (hours === "09" && minutes === "00") {
          announcement = sounds.goodMorning;
        }

        // 11:00 - Peak period
        else if (hours === "11" && minutes === "00") {
          announcement = sounds.peak;
        }

        // ==========================================
        // 2. FOCUS - EVERY 2 HOURS
        // ==========================================
        else if (minutes === "00" && Number(hours) % 2 === 0) {
          announcement = sounds.focus;
        }

        // ==========================================
        // 3. HAND WASH - EVERY 30 MINUTES
        // ==========================================
        else if (minutes === "00" || minutes === "30") {
          announcement = sounds.handWash;
        }

        // ==========================================
        // PLAY ANNOUNCEMENT
        // ==========================================

        if (announcement) {
          lastSpokenTime = currentTime;

          playAnnouncement(announcement);
        }

        // Disable alarm after midnight goodbye
        if (hours === "00" && minutes === "00") {
          setTimeout(() => {
            disableAlarm();
          }, 3000);
        }
      }

      // ==========================================
      // PLAY CHIME THEN ELEVENLABS RECORDING
      // ==========================================

      function playAnnouncement(voiceFile) {
        const volume = parseFloat(document.getElementById("volume").value);

        // Play announcement/chime first
        const alertSound = new Audio("./sounds/annoucement.mp3");

        alertSound.volume = volume;

        // When chime finishes, play recorded voice
        alertSound.addEventListener("ended", () => {
          const voice = new Audio(voiceFile);

          voice.volume = volume;

          voice.play().catch((err) => {
            console.error("Could not play voice:", err);
          });
        });

        // Play chime
        alertSound.play().catch((err) => {
          console.error("Could not play announcement sound:", err);
        });
      }

      // ==========================================
      // ENABLE ALARM
      // ==========================================

      function enableAlarm() {
        alarmEnabled = true;
        alert("Alarm enabled!");
      }

      // ==========================================
      // DISABLE ALARM
      // ==========================================

      function disableAlarm() {
        alarmEnabled = false;

        const btn = document.getElementById("btn");
        btn.textContent = "Enable Alarm";

        alert("Alarm disabled!");
      }

      // ==========================================
      // TOGGLE ALARM
      // ==========================================

      function toggleAlarm() {
        const btn = document.getElementById("btn");

        if (alarmEnabled === false) {
          enableAlarm();
          btn.textContent = "Disable Alarm";
        } else {
          disableAlarm();
        }
      }

      // ==========================================
      // START CLOCK
      // ==========================================

      updateClock();

      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
